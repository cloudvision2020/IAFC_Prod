    <div style="max-width:320px;background-color:#FAFAFB">
        <nav class="slds-nav-vertical slds-nav-vertical_shade" aria-label="Sub page">
            <template for:each={items} for:item="section">
                <div class="slds-nav-vertical__section" key={section}>
                    <h2 class="slds-nav-vertical__title">{section.title}</h2>
                    <ul aria-describedby="entity-header">
                        <template for:each={section.content} for:item="content">
                            <li class={content.css} key={content}>
                                <a href={content.link} class="slds-nav-vertical__action" aria-current="page"
                                    target={content.target}>{content.text}</a>
                            </li>
                        </template>
                    </ul>
                </div>
            </template>
        </nav>
    </div> 
</template>
